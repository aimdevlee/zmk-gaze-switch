# Vendor HID interface (USB and BLE) that lets a host pick the output.
CONFIG_ZMK_HOST_OUTPUT_SWITCH=y
CONFIG_ZMK_HOST_OUTPUT_SWITCH_HID=y
# HID_0 is ZMK's keyboard; ours is HID_1.
CONFIG_USB_HID_DEVICE_COUNT=2
# CONFIG_ZMK_HOST_OUTPUT_SWITCH_BLE_RECONNECT comes on with the HID interface;
# set it to n in your own .conf to turn it off.
