# Builds, signs and notarizes GazeSwitch and attaches the .dmg and .zip to a
# GitHub release. Runs when a v* tag is pushed; "Run workflow" rebuilds a tag
# that already has this workflow (v0.2.1 or later).
#
# Repository secrets it needs:
#   MACOS_CERTIFICATE_P12       Developer ID Application certificate and key, .p12, base64
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_ID                    Apple ID used for notarization
#   APPLE_TEAM_ID               developer team ID
#   APPLE_APP_PASSWORD          app-specific password of that Apple ID
name: Release GazeSwitch

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.2.1
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read the version from the tag
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3, got $TAG"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Set up a temporary keychain
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/release.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # codesign only looks in keychains on the search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" |
            awk '/Developer ID Application/ { print $2; exit }')
          [[ -n $IDENTITY ]] || { echo "No Developer ID Application identity in the certificate"; exit 1; }

          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: app/release.sh

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=(app/dist/GazeSwitch-$VERSION.dmg app/dist/GazeSwitch-$VERSION.zip)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "GazeSwitch $VERSION" --generate-notes --verify-tag
          fi

      - name: Delete the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
